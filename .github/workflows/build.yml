name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AURORASECRET_VERSION: '1.0.0'

jobs:
  build:
    name: Build (${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: windows-x86_64
          - os: ubuntu-latest
            package: linux-x86_64
          - os: macos-latest
            package: macos-universal

    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DAURORASECRET_BUILD_TESTS=ON
          -DAURORASECRET_LINUX_STATIC=ON

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DAURORASECRET_BUILD_TESTS=ON
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DAURORASECRET_BUILD_TESTS=ON
          -DAURORASECRET_MSVC_STATIC_RUNTIME=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="aurorasecret-${AURORASECRET_VERSION}-${{ matrix.package }}"
          mkdir -p "dist/${name}"
          cp build/aurorasecret "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          cp docs/FORMAT.md "dist/${name}/"
          ( cd dist && tar -czf "${name}.tar.gz" "${name}" )
          ls -l dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "aurorasecret-$env:AURORASECRET_VERSION-${{ matrix.package }}"
          $binary = Get-ChildItem -Path build -Recurse -Filter aurorasecret.exe |
                    Select-Object -First 1
          if (-not $binary) { throw 'aurorasecret.exe was not built' }
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item $binary.FullName "dist/$name/"
          Copy-Item README.md, LICENSE, docs/FORMAT.md "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force
          Get-ChildItem dist

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: aurorasecret-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every package
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: AuroraSecret ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false